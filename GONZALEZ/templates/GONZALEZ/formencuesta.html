{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REGISTRO</title>
    <link rel="stylesheet" href="{% static 'GONZALEZ/estilos.css' %}">
</head>
<body>
    <!-- ENCABEZADO -->
    <header>
        <h1>REGISTRA TUS DATOS</h1>

        <!-- MENÚ DE NAVEGACIÓN -->
        <nav>
            <ul>
                <li><a href="#inicio">INICIO</a></li>
                <li><a href="#registro">REGISTRO</a></li>
                <li><a href="#">TRES</a></li>
            </ul>
        </nav>
    </header>
    <form method="POST">
    <label>¿Cuál es tu villano favorito de toda la serie?</label>
    <input type="text" name="villano" placeholder="Escribe tu villano favorito...">
    <label>Correo electrónico para recibir el ranking final</label>
    <input type="email" name="email" placeholder="Escribe tu correo electrónico...">
    <label>Del 1 al 10, ¿qué tan malo consideras a ese personaje?</label>
    <input type="number" name="calificacion" min="1" max="10">
    <label>Fecha aproximada en la que viste la serie</label>
    <input type="date" name="fecha">
    <label>¿Cuál crees que fue el mejor villano?</label>
    <input type="radio" name="mejor_villano" value="Silas"> Silas
    <input type="radio" name="mejor_villano" value="Klaus"> Klaus
    <input type="radio" name="mejor_villano" value="Kai"> Kai
    <input type="radio" name="mejor_villano" value="Katherine"> Katherine
    <label>¿Qué características hacen mejor a un villano?</label>
    <input type="checkbox" name="caracteristicas" value="humor"> Su humor
    <input type="checkbox" name="caracteristicas" value="planes"> Sus planes
    <input type="checkbox" name="caracteristicas" value="fuerza"> Su fuerza
    <label>Escribe cuál fue la mejor escena de ese villano.</label>
    <textarea name="escena" placeholder="Escribe tu escena favorita..."></textarea>
    <button type="submit">Enviar encuesta</button>
    
</form>
